# Checks every pull request and every push to main on Windows (where the studio runs):
# types, server tests (node:test) and UI tests in a real browser (Playwright + the runner's Chrome).
# The same commands as locally: npm run lint, npm test, npm run test:ui.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch / PR cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Python the release ships (make_portable.ps1) and the same tools: Ruff, Jedi, pytest and the
      # disassembler libraries — so no test is skipped for a missing tool
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Python tools
        run: python -m pip install --disable-pip-version-check ruff jedi pytest pefile capstone keystone-engine

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Types
        run: npm run lint

      - name: Server tests
        run: npm test

      - name: UI tests
        run: npm run test:ui

      # A failed UI test leaves screenshots and a trace: download them from the run's page
      - name: UI test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
